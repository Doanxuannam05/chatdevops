apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat-app-sa
  labels:
    app: chat-devops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chat-app-role
  labels:
    app: chat-devops
rules:
  # Nguyên tắc tối thiểu quyền: Chỉ cho phép đọc thông tin cấu hình ConfigMap và Endpoints
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chat-app-rb
  labels:
    app: chat-devops
subjects:
  - kind: ServiceAccount
    name: chat-app-sa
roleRef:
  kind: Role
  name: chat-app-role
  apiGroup: rbac.authorization.k8s.io
