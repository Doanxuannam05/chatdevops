---
# ==============================================================================
# ROLE: DOCKER (Container Engine & Containerd Configuration)
# ==============================================================================

- name: Tạo thư mục chứa keyrings của APT
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Tải về Docker GPG key chính thức
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Thêm kho lưu trữ Docker APT Repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Cài đặt Docker CE và Docker Compose Plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Cấu hình Daemon Docker với Systemd Cgroup Driver và Log Rotation
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "exec-opts": ["native.cgroupdriver=systemd"],
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "3"
        },
        "storage-driver": "overlay2"
      }
    mode: '0644'
  notify: Restart Docker

- name: Thêm user hiện tại (ubuntu) vào group docker
  user:
    name: "{{ ansible_user | default('ubuntu') }}"
    groups: docker
    append: yes

- name: Khởi động và kích hoạt dịch vụ Docker
  systemd:
    name: docker
    state: started
    enabled: yes
