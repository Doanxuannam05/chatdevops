---
# ==============================================================================
# ROLE: NODE_EXPORTER (Prometheus Host Metrics Collector)
# Cài đặt dịch vụ thu thập chỉ số CPU, RAM, Disk, Network trên port 9100
# ==============================================================================

- name: Tạo system group cho node_exporter
  group:
    name: node_exporter
    system: yes
    state: present

- name: Tạo system user cho node_exporter
  user:
    name: node_exporter
    group: node_exporter
    system: yes
    shell: /sbin/nologin
    create_home: no

- name: Tải về và giải nén Prometheus Node Exporter v1.8.1
  unarchive:
    src: https://github.com/prometheus/node_exporter/releases/download/v1.8.1/node_exporter-1.8.1.linux-amd64.tar.gz
    dest: /tmp
    remote_src: yes
    creates: /tmp/node_exporter-1.8.1.linux-amd64/node_exporter

- name: Sao chép nhị phân node_exporter vào /usr/local/bin
  copy:
    src: /tmp/node_exporter-1.8.1.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    owner: node_exporter
    group: node_exporter
    mode: '0755'
    remote_src: yes

- name: Thiết lập Systemd Service Unit cho Node Exporter
  copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter --collector.systemd --collector.processes
      Restart=always
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify: Restart Node Exporter

- name: Khởi động và kích hoạt Systemd Node Exporter
  systemd:
    name: node_exporter
    daemon_reload: yes
    state: started
    enabled: yes
