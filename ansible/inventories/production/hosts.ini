# ==============================================================================
# ANSIBLE PRODUCTION INVENTORY
# ==============================================================================

[jenkins_controller]
jenkins-node ansible_host=13.250.10.11 node_name=jenkins-ci-server

[k3s_master]
k3s-master-node ansible_host=13.250.10.12 node_name=k3s-master-node

[k3s_workers]
k3s-worker-1 ansible_host=13.250.10.13 node_name=k3s-worker-node-1

[k3s_cluster:children]
k3s_master
k3s_workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
environment_name=production
