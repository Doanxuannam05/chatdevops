# ==============================================================================
# ANSIBLE STAGING INVENTORY
# ==============================================================================

[jenkins_controller]
staging-jenkins ansible_host=192.168.1.101 node_name=staging-jenkins

[k3s_master]
staging-k3s-master ansible_host=192.168.1.102 node_name=staging-k3s-master

[k3s_workers]
staging-k3s-worker-1 ansible_host=192.168.1.103 node_name=staging-k3s-worker-1

[k3s_cluster:children]
k3s_master
k3s_workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
environment_name=staging
